<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>GolasVisuals | Web připravujeme</title>
    <meta name="description" content="Video, foto a AI vizualizace pro realitní makléře. Nový web připravujeme." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --cream: #F7F7F3;
        --canopy: #2D3E2C;
        --deep: #223022;
        --lime: #E4FD97;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: var(--deep);
        color: var(--cream);
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
        text-align: center;
      }
      .eyebrow {
        margin: 0 0 28px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--lime);
      }
      h1 {
        margin: 0;
        max-width: 14ch;
        font-family: "Playfair Display", Georgia, serif;
        font-weight: 500;
        font-size: clamp(2.4rem, 7vw, 4.6rem);
        line-height: 1.08;
        letter-spacing: -0.02em;
      }
      h1 em { color: var(--lime); }
      .lead {
        margin: 24px 0 40px;
        max-width: 34rem;
        font-size: 16px;
        line-height: 1.8;
        color: color-mix(in srgb, var(--cream) 60%, transparent);
      }
      .contact {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 15px 30px;
        border-radius: 999px;
        background: var(--lime);
        color: var(--canopy);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-decoration: none;
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .contact:hover { opacity: 0.9; transform: scale(1.02); }
      footer {
        padding: 24px;
        text-align: center;
        font-size: 12px;
        color: color-mix(in srgb, var(--cream) 35%, transparent);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">GolasVisuals</p>
      <h1>Nový web se <em>připravuje</em></h1>
      <p class="lead">
        Video, foto a&nbsp;AI vizualizace pro realitní makléře.
        Spouštíme už brzy. Do té doby mi klidně napište.
      </p>
      <a class="contact" href="mailto:info@golasvisuals.com">info@golasvisuals.com</a>
    </main>
    <footer>© 2026 Pavel Golasowski</footer>
  </body>
</html>
